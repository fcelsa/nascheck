name: release

# A tag such as v1.0.0 builds the static binaries and publishes them, with
# their checksums, as a GitHub release whose notes are the version's
# section of CHANGELOG.md. Run by hand (Actions, release, Run workflow) it
# builds and tests them only, and keeps them as artifacts of the run.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Static binary, built on Alpine (musl)
        run: |
          docker run --rm -v "$PWD:/src" -w /src alpine:3.22 sh -ec '
              apk add -q build-base sqlite-dev sqlite-static ncurses-dev \
                  ncurses-static ncurses-terminfo-base
              make static
              make test
              make bindist'
      - name: The same binary on this glibc distribution
        run: |
          file nascheck
          ./nascheck -V
          env TERM=xterm-256color LC_ALL=C.UTF-8 LINES=40 COLUMNS=120 \
              NASCHECK_SMARTCTL=tests/fake-smartctl \
              NASCHECK_ZPOOL=tests/fake-zpool NASCHECK_ZFS=tests/fake-zfs \
              NASCHECK_SYSCTL=tests/fake-sysctl NASCHECK_TUI_SNAPSHOT=@2 \
              ./nascheck -l -c tests/conf/base.conf | tee /tmp/page
          grep -q 'Uptime' /tmp/page
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.runner }}
          path: nascheck-*.tar.gz
          if-no-files-found: error

  freebsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static binary, built on FreeBSD 15.1
        uses: vmactions/freebsd-vm@v1
        with:
          release: "15.1"
          prepare: pkg install -y sqlite3
          run: |
            make static STATIC_LIBS="-lm -lthr"
            file nascheck
            ./nascheck -V
            make test
            make bindist
      - uses: actions/upload-artifact@v4
        with:
          name: freebsd
          path: nascheck-*.tar.gz
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, freebsd]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          # The tag must name the version the binaries were built as.
          grep -Eq "^VERSION=[[:space:]]+$version\$" Makefile
          (cd dist && sha256sum nascheck-*.tar.gz > SHA256SUMS && cat SHA256SUMS)
          # This version's section of CHANGELOG.md, without its heading.
          awk -v v="$version" '/^## /{ p = index($0, "## " v " ") == 1; next } p' \
              CHANGELOG.md > notes.md
          test -s notes.md
          gh release create "$GITHUB_REF_NAME" dist/* \
              --title "nascheck $version" --notes-file notes.md
