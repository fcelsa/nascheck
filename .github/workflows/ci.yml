name: ci

on: [push, pull_request]

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get install -y libsqlite3-dev libncurses-dev
      - name: Build and test
        run: make CC=${{ matrix.cc }} CFLAGS="-O2 -Werror" test
      - name: Sanitizers
        run: make CC=${{ matrix.cc }} sanitize

  # Build and test on other Linux distributions, then show the packages
  # page with the container's own package manager.
  distros:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: archlinux:latest
            deps: pacman -Syu --noconfirm git gcc make sqlite ncurses diffutils gawk
            expect: "installed (pacman)"
          - image: alpine:latest
            deps: apk add git build-base sqlite-dev ncurses-dev ncurses-terminfo-base
            expect: "installed (apk)"
          - image: fedora:latest
            deps: dnf -y install git gcc make sqlite-devel ncurses-devel diffutils gawk
            expect: "by hand"
          - image: rockylinux:9
            deps: dnf -y install git gcc make sqlite-devel ncurses-devel diffutils gawk
            expect: "by hand"
          - image: debian:stable
            deps: apt-get update && apt-get install -y git gcc make libsqlite3-dev libncurses-dev ncurses-term
            expect: "installed (dpkg)"
          - image: opensuse/tumbleweed
            deps: zypper -n install git gcc make sqlite3-devel ncurses-devel diffutils gawk
            expect: "installed (rpm)"
    container: ${{ matrix.image }}
    steps:
      - name: Dependencies
        run: ${{ matrix.deps }}
      - name: Source
        # git instead of actions/checkout, which needs a glibc node.
        run: |
          git config --global --add safe.directory '*'
          git init -q .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git fetch -q --depth 1 origin "$GITHUB_SHA"
          git checkout -q FETCH_HEAD
      - name: Build and test
        run: make CFLAGS="-O2 -Werror" test
      - name: Packages page with the real package manager
        run: |
          cat /etc/os-release | head -2
          env TERM=xterm-256color LC_ALL=C.UTF-8 LINES=40 COLUMNS=120 \
              NASCHECK_SMARTCTL=tests/fake-smartctl \
              NASCHECK_ZPOOL=tests/fake-zpool NASCHECK_ZFS=tests/fake-zfs \
              NASCHECK_SYSCTL=tests/fake-sysctl NASCHECK_TUI_SNAPSHOT=@3SS \
              ./nascheck -l -c tests/conf/base.conf | tee /tmp/page
          grep -qF "${{ matrix.expect }}" /tmp/page

  freebsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build, test and run the service on FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          release: "15.1"
          prepare: pkg install -y smartmontools sqlite3
          run: |
            freebsd-version
            make CFLAGS="-O2 -Werror" test
            # Install and run the rc.d service against the VM's disks.
            make install
            sysrc nascheck_enable=YES
            service nascheck start
            sleep 2
            service nascheck status
            nascheck refresh
            nascheck status
            nascheck check || true
            # A real pool on a memory disk with a GPT label.
            mdconfig -a -t swap -s 256m -u 10
            gpart create -s gpt md10
            gpart add -t freebsd-zfs -l citest md10
            zpool create citank gpt/citest
            nascheck refresh
            nascheck status | tee /tmp/status
            grep -q '^citank .*ONLINE' /tmp/status
            grep -q 'gpt/citest' /tmp/status
            nascheck -l check || true
            # One screen of the interface, as text.
            env TERM=xterm-256color LC_ALL=C.UTF-8 LINES=40 COLUMNS=120 \
                NASCHECK_TUI_SNAPSHOT= nascheck
            env TERM=xterm-256color LC_ALL=C.UTF-8 LINES=40 COLUMNS=120 \
                NASCHECK_TUI_SNAPSHOT=2 nascheck
            env TERM=xterm-256color LC_ALL=C.UTF-8 LINES=40 COLUMNS=120 \
                NASCHECK_TUI_SNAPSHOT=@3sqlite nascheck
            env TERM=xterm-256color LC_ALL=C.UTF-8 LINES=40 COLUMNS=120 \
                NASCHECK_TUI_SNAPSHOT=G nascheck
            zpool destroy citank
            service nascheck reload
            service nascheck stop
            ls -l /var/db/nascheck
            grep nascheck /var/log/messages
            # The daemon must not have logged any error of its own.
            ! grep -E 'nascheck\[[0-9]+\]: (.*: )?(smartctl|zpool|database|poll|signals|setenv|out of memory|group .* not found)' \
                /var/log/messages
